version: "2026-08-24.2"
detectors:
  - id: cms.wordpress
    name: WordPress
    category: publishing_platform
    interpretation: Offentlige spor tyder på at WordPress brukes til publisering.
    false_positive_note: Et nettsted som har byttet system kan fortsatt ha gamle WordPress-filer.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: '/wp-(content|includes)/', weight: 45 }
      - { type: html, pattern: 'wp-json|/wp-content/', weight: 35 }
      - { type: meta_generator, pattern: 'wordpress', weight: 55 }

  - id: cms.ghost
    name: Ghost
    category: publishing_platform
    interpretation: Offentlige spor tyder på at publiseringsplattformen Ghost brukes.
    false_positive_note: Innlastede Ghost-filer alene beviser ikke at hele nettstedet publiseres med Ghost.
    thresholds: { likely: 50, strong: 80 }
    signals:
      - { type: meta_generator, pattern: 'ghost', weight: 60 }
      - { type: script_url, pattern: 'ghost\.io|/ghost/', weight: 45 }
      - { type: html, pattern: 'ghost-(content|portal)|data-ghost', weight: 40 }

  - id: cms.arcxp
    name: Arc XP
    category: publishing_platform
    interpretation: Offentlige filer tyder på teknologi knyttet til Arc XP / Arc Publishing.
    false_positive_note: En utgiver kan bruke enkelte Arc-tjenester uten å bruke Arc som hele publiseringssystemet.
    thresholds: { likely: 50, strong: 85 }
    signals:
      - { type: script_url, pattern: 'arcxp\.com|arcpublishing\.com|arc-publishing', weight: 60 }
      - { type: html, pattern: 'arcxp|arcpublishing|arc-publishing', weight: 45 }

  - id: paywall.piano
    name: Piano
    category: paywall
    interpretation: Offentlige skript eller informasjonskapsler tyder på at Piano brukes til abonnement eller personalisering.
    false_positive_note: Piano kan brukes til analyse eller personalisering uten at alle sider har betalingsmur.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'tinypass\.com|piano\.io', weight: 60 }
      - { type: request_domain, pattern: '(^|\.)tinypass\.com$|(^|\.)piano\.io$', weight: 45 }
      - { type: cookie_name, pattern: '^__tac|^tp_|piano', weight: 30 }

  - id: paywall.zephr
    name: Zephr
    category: paywall
    interpretation: Offentlige filer tyder på at Zephr brukes til abonnement eller personalisering.
    false_positive_note: Zephr-skript kan lastes før systemet avgjør om en betalingsmur skal vises.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'zephr\.com|zephr-browser', weight: 65 }
      - { type: request_domain, pattern: '(^|\.)zephr\.com$', weight: 45 }
      - { type: html, pattern: 'zephr-browser|data-zephr', weight: 35 }

  - id: analytics.gtm
    name: Google Tag Manager
    category: analytics
    interpretation: Google Tag Manager lastes inn eller omtales på siden.
    false_positive_note: En Tag Manager-beholder kan styre mange ulike verktøy; samme ID er et spor, ikke alene et eierskapsbevis.
    thresholds: { likely: 40, strong: 75 }
    signals:
      - { type: script_url, pattern: 'googletagmanager\.com/(gtm|ns)\.js', weight: 55 }
      - { type: html, pattern: 'GTM-[A-Z0-9]+', capture: '(GTM-[A-Z0-9]+)', weight: 45 }

  - id: analytics.google
    name: Google Analytics
    category: analytics
    interpretation: Google Analytics lastes inn eller omtales på siden.
    false_positive_note: En måle-ID er et kontospor, men beviser ikke hvem som eier eller kontrollerer kontoen.
    thresholds: { likely: 40, strong: 75 }
    signals:
      - { type: script_url, pattern: 'google-analytics\.com|googletagmanager\.com/gtag/js', weight: 55 }
      - { type: html, pattern: '(?:G-[A-Z0-9]{6,}|UA-[0-9]+-[0-9]+)', capture: '((?:G-[A-Z0-9]{6,}|UA-[0-9]+-[0-9]+))', weight: 45 }

  - id: analytics.snowplow
    name: Snowplow
    category: analytics
    interpretation: Offentlige filer tyder på at Snowplow brukes til analyse.
    false_positive_note: Navnet kan forekomme i annet innhold; skript- og nettverksspor er sterkere dokumentasjon.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'snowplow|sp\.js', weight: 55 }
      - { type: request_domain, pattern: 'snowplow', weight: 45 }
      - { type: html, pattern: 'newTracker\(|snowplow\(', weight: 50 }

  - id: analytics.matomo
    name: Matomo
    category: analytics
    interpretation: Offentlige filer tyder på at Matomo eller det tidligere navnet Piwik brukes til analyse.
    false_positive_note: Gamle referanser kan bli liggende igjen etter at nettstedet har byttet løsning.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'matomo\.js|piwik\.js', weight: 60 }
      - { type: html, pattern: '_paq\.push|Matomo', weight: 45 }

  - id: consent.onetrust
    name: OneTrust
    category: consent
    interpretation: Offentlige filer tyder på at OneTrust brukes til samtykkehåndtering.
    false_positive_note: Et skript kan være til stede selv om en annen løsning vises i enkelte land.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'cdn\.cookielaw\.org|onetrust\.com', weight: 65 }
      - { type: cookie_name, pattern: 'OptanonConsent|OptanonAlertBoxClosed', weight: 45 }

  - id: consent.didomi
    name: Didomi
    category: consent
    interpretation: Offentlige filer tyder på at Didomi brukes til samtykkehåndtering.
    false_positive_note: Regional innlasting kan gjøre at resultatet varierer etter hvor undersøkelsen kjøres fra.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'didomi\.io|privacy-center\.org', weight: 65 }
      - { type: cookie_name, pattern: 'didomi', weight: 40 }

  - id: consent.sourcepoint
    name: Sourcepoint
    category: consent
    interpretation: Offentlige filer tyder på at Sourcepoint brukes til samtykkehåndtering.
    false_positive_note: Regional innlasting kan gjøre at resultatet varierer etter hvor undersøkelsen kjøres fra.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'privacy-mgmt\.com', weight: 65 }
      - { type: request_domain, pattern: '(^|\.)privacy-mgmt\.com$', weight: 45 }

  - id: consent.cookiebot
    name: Cookiebot
    category: consent
    interpretation: Offentlige filer tyder på at Cookiebot brukes til samtykkehåndtering.
    false_positive_note: Et ubrukt skript kan bli liggende igjen etter at nettstedet har byttet leverandør.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'consent\.cookiebot\.com', weight: 65 }
      - { type: cookie_name, pattern: 'CookieConsent', weight: 40 }

  - id: advertising.google_gpt
    name: Google Publisher Tag
    category: advertising
    interpretation: Google Publisher Tag lastes inn eller omtales og tyder på teknologi for annonsevisning.
    false_positive_note: Funnet identifiserer annonseteknologi, ikke et bestemt kommersielt samarbeid.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'securepubads\.g\.doubleclick\.net/tag/js/gpt\.js|googletagservices\.com/tag/js/gpt\.js', weight: 70 }
      - { type: html, pattern: 'googletag\.defineSlot|googletag\.cmd', weight: 45 }

  - id: advertising.prebid
    name: Prebid.js
    category: advertising
    interpretation: Offentlige filer tyder på at Prebid.js brukes til annonseauksjoner i nettleseren.
    false_positive_note: Programbiblioteket kan være lastet uten at en annonseauksjon kjøres på hver side.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: script_url, pattern: 'prebid(?:\.min)?\.js', weight: 65 }
      - { type: html, pattern: 'pbjs\.que|pbjs\.requestBids', weight: 50 }

  - id: infrastructure.cloudflare
    name: Cloudflare
    category: infrastructure
    interpretation: Svarhoder eller filer tyder på at Cloudflare leverer eller beskytter nettstedet.
    false_positive_note: Bruk av Cloudflare betyr ikke at nettsteder med samme leverandør har felles eier.
    thresholds: { likely: 45, strong: 80 }
    signals:
      - { type: header, pattern: '^server:\s*cloudflare$', weight: 65 }
      - { type: header, pattern: '^cf-ray:', weight: 60 }
      - { type: script_url, pattern: 'cdnjs\.cloudflare\.com', weight: 20 }
