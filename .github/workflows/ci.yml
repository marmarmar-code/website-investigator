name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4 major tag snapshot
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # pinned v5 major tag snapshot
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[all,dev]'
      - name: Public/private boundary
        run: python scripts/check_public_boundary.py
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest --cov=website_investigator --cov-report=term-missing
      - name: Test stateless Slack receiver
        run: node --test cloudflare/test/worker.test.mjs
      - name: Validate workflow YAML
        run: python scripts/check_workflow_yaml.py .github/workflows
      - name: Review installed runtime dependency licenses
        run: python scripts/check_dependency_licenses.py
      - name: Build wheel and source distribution
        run: |
          pip install build
          python -m build
