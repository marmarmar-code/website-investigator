name: Private Slack investigation

on:
  workflow_dispatch:
    inputs:
      job:
        description: Encrypted private Slack job
        required: true
        type: string

concurrency:
  group: website-investigator-private-runtime
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out private runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: marmarmar-code/website-investigator-runtime
          ref: main
          ssh-key: ${{ secrets.WI_RUNTIME_DEPLOY_KEY }}
          persist-credentials: true
          fetch-depth: 0
          path: runtime

      - name: Verify private runtime boundary
        shell: bash
        run: |
          test -f runtime/PRIVATE_REPOSITORY_WARNING.md
          git -C runtime remote get-url origin | \
            grep -Eq '^git@github\.com:marmarmar-code/website-investigator-runtime(\.git)?$'
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            https://api.github.com/repos/marmarmar-code/website-investigator-runtime)
          test "$HTTP_STATUS" = "404"

      - name: Run encrypted Slack investigation with pinned public engine
        env:
          WI_REDACT_LOGS: "1"
          WI_SLACK_BOT_TOKEN: ${{ secrets.WI_SLACK_BOT_TOKEN }}
          WI_SLACK_JOB: ${{ inputs.job }}
          WI_SLACK_PAYLOAD_KEY: ${{ secrets.WI_SLACK_PAYLOAD_KEY }}
        shell: bash
        run: |
          test -n "$WI_SLACK_BOT_TOKEN"
          test -n "$WI_SLACK_JOB"
          test -n "$WI_SLACK_PAYLOAD_KEY"
          echo "::add-mask::$WI_SLACK_JOB"
          IMAGE=$(awk -F'"' '/^[[:space:]]*image:/ {print $2}' runtime/engine.lock)
          DIGEST=$(awk -F'"' '/^[[:space:]]*digest:/ {print $2}' runtime/engine.lock)
          test "$IMAGE" = "ghcr.io/marmarmar-code/website-investigator"
          test -n "$DIGEST"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE@$DIGEST"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e WI_REDACT_LOGS \
            -e WI_SLACK_BOT_TOKEN \
            -e WI_SLACK_JOB \
            -e WI_SLACK_PAYLOAD_KEY \
            -v "$GITHUB_WORKSPACE/runtime:/runtime" \
            "$IMAGE@$DIGEST" slack cloud-job --runtime /runtime

      - name: Persist only private runtime outputs
        shell: bash
        run: |
          if [ -z "$(git -C runtime status --porcelain -- data reports)" ]; then
            echo "No runtime changes"
            exit 0
          fi
          git -C runtime config user.name "website-investigator[bot]"
          git -C runtime config user.email "website-investigator[bot]@users.noreply.github.com"
          git -C runtime add data reports
          git -C runtime diff --cached --quiet && {
            echo "No runtime changes"
            exit 0
          }
          git -C runtime commit --quiet -m "Record private Slack investigation"
          git -C runtime push --quiet origin HEAD:main
