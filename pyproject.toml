[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "website-investigator"
version = "0.4.1"
description = "Evidence-first website inspection and private monitoring for journalists"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Website Investigator contributors" }]
keywords = ["journalism", "osint", "website", "monitoring", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "dnspython>=2.6,<3",
  "extruct>=0.18,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "protego>=0.4,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "tldextract>=5.1,<6",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
deep = ["playwright>=1.48,<2"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
notify = ["apprise>=1.9,<2"]
slack = ["slack-bolt>=1.23,<2"]
cloud = ["cryptography>=43,<51"]
dev = [
  "packaging>=24,<27",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
all = [
  "playwright>=1.48,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "apprise>=1.9,<2",
  "slack-bolt>=1.23,<2",
  "cryptography>=43,<51",
]

[project.scripts]
wi = "website_investigator.cli:app"

[project.urls]
Homepage = "https://github.com/marmarmar-code/website-investigator"
Issues = "https://github.com/marmarmar-code/website-investigator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/website_investigator"]

[tool.hatch.build]
include = [
  "src/website_investigator/**/*.py",
  "src/website_investigator/templates/*.html",
  "src/website_investigator/static/*.css",
  "src/website_investigator/data/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
