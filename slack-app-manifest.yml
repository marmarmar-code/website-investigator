_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Website Investigator
  description: Undersøk nettsteder og få en privat rapport i Slack.
  background_color: "#17324D"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: Website Investigator
    always_online: false
  slash_commands:
    - command: /undersok
      description: Undersøk et nettsted privat
      usage_hint: nettadresse.no
      should_escape: true
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - files:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
